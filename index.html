<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quill's Claim</title>
<style>
:root{--ink:#2a1a10;--paper:#f3e3c3;--gold:#d9a441}

canvas{display:block}

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

</head>
<body>
<div id="info">Drag to look, click to act. On a Quest 3, open this page in the Meta Quest Browser and tap Enter VR.</div>
<div id="inv" aria-label="Pockets"></div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
const DAY_SKY = new THREE.Color(0xa9cde8), DAY_FOG = new THREE.Color(0xe3c79d);
const DUSK_SKY = new THREE.Color(0xf09a55), DUSK_FOG = new THREE.Color(0xe8a46a);
scene.background = DAY_SKY.clone();
scene.fog = new THREE.Fog(DAY_FOG.clone(), 18, 80);

const rig = new THREE.Group();
scene.add(rig);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0, 1.6, 0);
rig.add(camera);

const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x7a5a38, 1.15);
const sun = new THREE.DirectionalLight(0xfff0d0, 2.3);
sun.position.set(6, 10, 4);
scene.add(hemi, sun);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const info = document.getElementById('info');
const invDom = document.getElementById('inv');
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    if (ok) info.textContent = 'Tap Enter VR at the bottom of the page to play on your headset, or drag and click to play here.';
  }).catch(() => {});
}

/* ================= build helpers ================= */
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true, ...o });
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const C = (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s);
const S = r => new THREE.SphereGeometry(r, 12, 8);
const K = (r, h, s = 8) => new THREE.ConeGeometry(r, h, s);
function mk(geo, color, x = 0, y = 0, z = 0, parent = scene, o) {
  const m = new THREE.Mesh(geo, mat(color, o));
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
const P = (deg, r) => { const a = deg * Math.PI / 180; return new THREE.Vector3(Math.sin(a) * r, 0, -Math.cos(a) * r); };
function station(deg, r) {            // a group placed on the ring, its +z side facing the player
  const g = new THREE.Group();
  const p = P(deg, r);
  g.position.copy(p);
  g.rotation.y = Math.atan2(-p.x, -p.z);
  scene.add(g);
  return g;
}
function signTex(text, w, h, bg, fg, fs) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, w, h);
  x.strokeStyle = fg; x.lineWidth = 6; x.strokeRect(8, 8, w - 16, h - 16);
  x.fillStyle = fg; x.font = `bold ${fs}px Georgia, serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, w / 2, h / 2 + 3);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function sign(text, w, h, x, y, z, parent, bg = '#5a3b22', fg = '#f3e3c3', fs = 54, wp = 1.6) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wp, wp * h / w), new THREE.MeshBasicMaterial({ map: signTex(text, w, h, bg, fg, fs) }));
  m.position.set(x, y, z); parent.add(m); return m;
}
function person(g, x, z, o) {
  const p = new THREE.Group();
  p.position.set(x, 0, z);
  mk(C(0.2, 0.27, 0.95, 10), o.coat, 0, 0.55, 0, p);
  mk(S(0.15), o.skin || 0xe0b48c, 0, 1.2, 0, p);
  mk(B(0.09, 0.5, 0.09), o.coat, -0.29, 0.75, 0, p);
  mk(B(0.09, 0.5, 0.09), o.coat, 0.29, 0.75, 0, p);
  if (o.hat === 'brim') { mk(C(0.3, 0.3, 0.02, 14), o.hatC, 0, 1.31, 0, p); mk(C(0.14, 0.15, 0.16, 12), o.hatC, 0, 1.4, 0, p); }
  if (o.hat === 'bonnet') { mk(S(0.18), o.hatC, 0, 1.27, -0.02, p).scale.set(1, 0.7, 1); }
  if (o.hat === 'visor') { mk(C(0.17, 0.17, 0.05, 12), o.hatC, 0, 1.33, 0, p); mk(B(0.28, 0.02, 0.18), o.hatC, 0, 1.31, 0.15, p); }
  if (o.apron) mk(B(0.3, 0.55, 0.02), o.apron, 0, 0.5, 0.24, p);
  g.add(p);
  return p;
}

/* ================= world ================= */
const ground = mk(new THREE.CircleGeometry(90, 48), 0xb08a58, 0, 0, 0, scene, { flatShading: false }); ground.rotation.x = -Math.PI / 2;
const lane = mk(new THREE.PlaneGeometry(2.2, 14), 0x8f6d44, 0, 0.01, -7, scene, { flatShading: false }); lane.rotation.x = -Math.PI / 2;
const yard = mk(new THREE.CircleGeometry(2.4, 40), 0x9a774b, 0, 0.012, 0, scene, { flatShading: false }); yard.rotation.x = -Math.PI / 2;

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 30; i++) {
  const a = (i / 30) * Math.PI * 2, r = 42 + rnd() * 10, h = 12 + rnd() * 14;
  mk(K(8 + rnd() * 6, h, 5), new THREE.Color().setHSL(0.04 + rnd() * 0.04, 0.4, 0.42 + rnd() * 0.1), Math.cos(a) * r, h / 2, Math.sin(a) * r);
}
for (let i = 0; i < 46; i++) {
  const a = rnd() * Math.PI * 2, r = 16 + rnd() * 18;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  mk(C(0.12, 0.17, 1.2, 6), 0x5a3b22, x, 0.6, z);
  mk(K(0.95, 2.4, 7), 0x2f5d34, x, 2.2, z);
  mk(K(0.7, 1.7, 7), 0x3a6e3e, x, 3.2, z);
}
// town signpost
{ const g = station(-12, 5.2); mk(B(0.1, 1.5, 0.1), 0x5a3b22, 0, 0.75, 0, g); sign('COPPER FORD  pop. 41', 512, 160, 0, 1.45, 0.07, g, '#6b4a2a', '#f3e3c3', 48, 1.1); }

/* ---- Quill's cabin (front) ---- */
const cabin = station(0, 12);
mk(B(3.4, 2.1, 2.6), 0x7a5233, 0, 1.05, 0, cabin);
const roofM = mk(K(2.9, 1.3, 4), 0x4a2e1b, 0, 2.75, 0, cabin); roofM.rotation.y = Math.PI / 4; roofM.scale.z = 0.8;
mk(B(0.9, 1.6, 0.04), 0x14100c, 0, 0.8, 1.31, cabin);               // dark doorway
const doorPivot = new THREE.Group(); doorPivot.position.set(-0.45, 0, 1.33); cabin.add(doorPivot);
mk(B(0.9, 1.6, 0.06), 0x8a5a2b, 0.45, 0.8, 0, doorPivot);
mk(S(0.045), 0xd9a441, 0.8, 0.8, 0.06, doorPivot);
mk(B(0.5, 0.5, 0.05), 0x2a2018, 1.1, 1.2, 1.31, cabin);
sign('QUILL', 256, 96, 0, 2.05, 1.32, cabin, '#4a2e1b', '#f3e3c3', 54, 0.9);

/* ---- Pickles the mule (in the lane) ---- */
const mule = new THREE.Group();
const muleStart = P(0, 7.2);
mule.position.copy(muleStart);
mk(B(0.5, 0.6, 1.15), 0x8d7a66, 0, 0.9, 0, mule);
mk(B(0.22, 0.5, 0.25), 0x8d7a66, 0, 1.3, 0.55, mule).rotation.x = -0.4;
mk(B(0.24, 0.26, 0.42), 0x9a8672, 0, 1.52, 0.78, mule);
mk(B(0.16, 0.1, 0.12), 0x4a3b2e, 0, 1.46, 1.0, mule);
[-1, 1].forEach(s => { mk(B(0.06, 0.28, 0.05), 0x8d7a66, s * 0.1, 1.76, 0.7, mule).rotation.z = -s * 0.2; });
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => mk(B(0.1, 0.62, 0.1), 0x6e5d4c, sx * 0.17, 0.31, sz * 0.4, mule));
mk(B(0.08, 0.08, 0.5), 0x4a3b2e, 0, 0.98, -0.8, mule).rotation.x = 0.5;
mule.rotation.y = 0;
scene.add(mule);

/* ---- forge (right) ---- */
const forge = station(72, 6.5);
mk(B(1.8, 1.1, 1.2), 0x6e6a64, 0.2, 0.55, -0.9, forge);
mk(B(0.4, 2.2, 0.4), 0x5d5953, 0.7, 1.1, -1.1, forge);
mk(B(1.3, 0.04, 0.8), 0xff7a1a, 0.1, 1.11, -0.8, forge, { emissive: 0xff5a00, emissiveIntensity: 1.2 }).userData.noHL = true;
mk(C(0.22, 0.28, 0.5, 8), 0x5a3b22, -1.2, 0.25, 0.1, forge);
mk(B(0.5, 0.18, 0.2), 0x2c2c30, -1.2, 0.58, 0.1, forge);
mk(B(1.9, 0.15, 0.95), 0x6b4a2a, -2.5, 0.75, 0.8, forge);             // wagon bed
[-0.7, 0.7].forEach(x => { const w = mk(C(0.45, 0.45, 0.07, 14), 0x4a2e1b, -2.5 + x, 0.45, 1.3, forge); w.rotation.x = Math.PI / 2; });
sign('KETTLE & DAUGHTER SMITHY', 640, 128, 0.2, 2.4, -0.68, forge, '#3a2517', '#f3e3c3', 44, 1.7);
const dora = person(forge, 0.2, 0.5, { coat: 0x3b4a63, hat: 'visor', hatC: 0x24201b, apron: 0x2c2018 });

/* ---- mess tent (left) ---- */
const mess = station(-72, 6.5);
const tent = mk(K(2.1, 2.5, 4), 0xdacbb0, 0, 1.25, -1.2, mess); tent.rotation.y = Math.PI / 4;
mk(B(1.8, 0.1, 0.8), 0x7a5233, 0.1, 0.85, 0.35, mess);
[-0.8, 0.9].forEach(x => mk(B(0.08, 0.85, 0.08), 0x5a3b22, x, 0.42, 0.35, mess));
mk(C(0.26, 0.22, 0.28, 12), 0x2a2a2e, 0.55, 1.04, 0.35, mess);
sign('HATTIE’S BISCUITS', 512, 128, 0, 2.6, -0.1, mess, '#7a3b22', '#ffe9c4', 52, 1.5);
const hattie = person(mess, -0.5, 1.0, { coat: 0xb55a3c, hat: 'bonnet', hatC: 0xf3e3c3, apron: 0xf3e3c3 });

/* ---- assay office (rear right) ---- */
const office = station(140, 8);
mk(B(3.4, 2.7, 2.2), 0x6b5236, 0, 1.35, -1.2, office);
mk(B(3.4, 1.0, 0.12), 0x6b5236, 0, 3.1, -0.15, office);
sign('ASSAY OFFICE', 512, 128, 0, 3.1, -0.07, office, '#2e2a24', '#e8d9a8', 56, 1.9);
mk(B(2.0, 0.9, 0.5), 0x8a5a2b, 0, 0.45, 0.2, office);
mk(B(0.5, 0.04, 0.35), 0xf3e3c3, 0.5, 0.92, 0.2, office);
const finch = person(office, 0, -0.1, { coat: 0x2d2d33, hat: 'visor', hatC: 0x26382c });
const barnaby = person(office, 2.4, 1.3, { coat: 0x8a6a3e, hat: 'brim', hatC: 0x5a3b22, skin: 0xd9a77a });
barnaby.visible = false;

/* ---- creek (rear left) ---- */
const creekSt = station(-140, 6);
const water = mk(new THREE.PlaneGeometry(2.6, 26), 0x3d86b5, 0, 0.02, 0, creekSt, { roughness: 0.2, transparent: true, opacity: 0.92, flatShading: false });
water.rotation.x = -Math.PI / 2; water.rotation.z = Math.PI / 2;
for (let i = 0; i < 9; i++) mk(S(0.2 + rnd() * 0.2), 0x8a8780, (rnd() - 0.5) * 3.4, 0.05, (rnd() - 0.5) * 12, creekSt);

/* ---- pickups ---- */
const bucketSt = station(-108, 5);
mk(B(0.1, 1.2, 0.1), 0x5a3b22, 0, 0.6, 0, bucketSt);
mk(B(0.5, 0.08, 0.08), 0x5a3b22, 0.2, 1.1, 0, bucketSt);
const bucketG = new THREE.Group(); bucketG.position.set(0.38, 0.88, 0); bucketSt.add(bucketG);
mk(C(0.16, 0.12, 0.26, 14), 0x9aa0a6, 0, 0, 0, bucketG, { metalness: 0.5, roughness: 0.5 });

const hayG = station(32, 3.6);
mk(B(0.9, 0.45, 0.55), 0xd6b45a, 0, 0.22, 0, hayG);
mk(B(0.9, 0.45, 0.55), 0xc9a64c, 0.5, 0.22, 0.7, hayG).rotation.y = 0.5;
const shoeG = new THREE.Group(); shoeG.position.set(-0.55, 0.03, 0.7); shoeG.rotation.x = -Math.PI / 2; hayG.add(shoeG);
{ const t = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.022, 6, 16, Math.PI * 1.7), mat(0x8c9096, { metalness: 0.6, roughness: 0.5 })); t.rotation.z = Math.PI * 0.65; shoeG.add(t); }

/* ================= audio ================= */
let actx = null;
function audio() {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function tone(f, d, type = 'sine', v = 0.12, slide = 0, delay = 0) {
  if (!actx) return;
  try {
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const blip = () => tone(520, 0.05, 'square', 0.05);
const chime = () => { tone(784, 0.14, 'triangle', 0.14); tone(1175, 0.22, 'triangle', 0.14, 0, 0.09); };
const nope = () => tone(160, 0.18, 'sawtooth', 0.09, -60);
const stampSfx = () => { tone(110, 0.25, 'square', 0.25, -60); };
const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.15, 0, i * 0.16));

/* ================= game state ================= */
const ITEMS = {
  letter: { name: "Uncle's letter", look: [
    "Dear kin. If you are reading this, I have been delayed. Again.",
    "Three things. My cabin key is with Dora at the smithy; she owes me for a wagon axle.",
    "Hattie's biscuits are the best in the territory, and Pickles my mule will do anything for one.",
    "The deed is in my cabin. File it at the assay office before sundown, and do not let Finch bully you.  — B. Quill" ] },
  bucket: { name: 'Tin bucket', look: ['A dented tin bucket. It is exactly as empty as it looks.'] },
  waterBucket: { name: 'Bucket of creek water', look: ['Cold, clear, and slopping a little. Walk carefully.'] },
  biscuit: { name: 'Warm biscuit', look: ['A warm biscuit. It smells like every good decision you have never made.'] },
  horseshoe: { name: 'Crooked horseshoe', look: ['Slightly bent. Probably still lucky.'] },
  key: { name: 'Brass key', look: ['A heavy brass key with a tag in Quill’s handwriting: "CABIN. NOT THE OUTHOUSE."'] },
  deed: { name: "Quill's deed", look: ['Signed and sealed. All it needs is a stamp from the assay office.'] }
};
let F = {}, inv = ['letter'], sel = null;
const has = i => inv.includes(i);

/* ================= dialogue panel ================= */
const dc = document.createElement('canvas'); dc.width = 1024; dc.height = 400;
const dctx = dc.getContext('2d');
const dtex = new THREE.CanvasTexture(dc); dtex.colorSpace = THREE.SRGBColorSpace;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.6 * 400 / 1024), new THREE.MeshBasicMaterial({ map: dtex, transparent: true, depthTest: false }));
panel.renderOrder = 10; panel.visible = false;
scene.add(panel);

function wrap(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawDlg(speaker, text, more) {
  const x = dctx;
  x.clearRect(0, 0, 1024, 400);
  x.fillStyle = 'rgba(42,26,16,0.94)'; x.beginPath(); x.roundRect(6, 6, 1012, 388, 26); x.fill();
  x.strokeStyle = '#d9a441'; x.lineWidth = 6; x.beginPath(); x.roundRect(14, 14, 996, 372, 20); x.stroke();
  let y = 70;
  if (speaker) {
    x.fillStyle = '#d9a441'; x.font = 'bold 38px Georgia, serif'; x.textAlign = 'left'; x.fillText(speaker.toUpperCase(), 44, y); y += 22;
  }
  x.fillStyle = '#f7ead0'; x.font = (speaker ? '' : 'italic ') + '42px Georgia, serif'; x.textAlign = 'left';
  const lines = wrap(x, text, 930);
  y += 48;
  lines.slice(0, 5).forEach((l, i) => x.fillText(l, 44, y + i * 54));
  x.fillStyle = '#c9a96e'; x.font = '26px system-ui, sans-serif'; x.textAlign = 'right';
  x.fillText(more ? 'trigger / click to continue  ▶' : 'trigger / click to close', 990, 368);
  dtex.needsUpdate = true;
}
const _p = new THREE.Vector3(), _d = new THREE.Vector3();
function placePanel() {
  camera.updateWorldMatrix(true, false);
  camera.getWorldPosition(_p); camera.getWorldDirection(_d);
  _d.y = 0; if (_d.lengthSq() < 1e-4) _d.set(0, 0, -1); _d.normalize();
  panel.position.copy(_p).addScaledVector(_d, 1.6); panel.position.y = _p.y - 0.18;
  panel.lookAt(_p.x, panel.position.y, _p.z);
}
let dlg = null;
function showLine() {
  const raw = dlg.lines[dlg.i], k = raw.indexOf('|');
  drawDlg(k > 0 ? raw.slice(0, k) : '', k > 0 ? raw.slice(k + 1) : raw, dlg.i < dlg.lines.length - 1);
}
function say(lines, done) {
  dlg = { lines, i: 0, done };
  placePanel(); panel.visible = true; showLine();
}
function advance() {
  blip();
  dlg.i++;
  if (dlg.i >= dlg.lines.length) { const d = dlg.done; dlg = null; panel.visible = false; if (d) d(); }
  else showLine();
}

/* ================= inventory ================= */
const ic = document.createElement('canvas'); ic.width = 512; ic.height = 512;
const ictx = ic.getContext('2d');
const itex = new THREE.CanvasTexture(ic); itex.colorSpace = THREE.SRGBColorSpace;
const invPanel = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2), new THREE.MeshBasicMaterial({ map: itex, transparent: true, side: THREE.DoubleSide }));
invPanel.visible = false;
const INV_HEAD = 70, INV_ROW = 66;
function refreshInv() {
  const x = ictx;
  x.clearRect(0, 0, 512, 512);
  x.fillStyle = 'rgba(42,26,16,0.95)'; x.beginPath(); x.roundRect(4, 4, 504, 504, 24); x.fill();
  x.strokeStyle = '#d9a441'; x.lineWidth = 6; x.beginPath(); x.roundRect(10, 10, 492, 492, 20); x.stroke();
  x.fillStyle = '#c9a96e'; x.font = 'bold 30px system-ui, sans-serif'; x.textAlign = 'left'; x.fillText('POCKETS', 30, 54);
  inv.forEach((id, i) => {
    const y = INV_HEAD + i * INV_ROW;
    if (id === sel) { x.fillStyle = '#6b4a22'; x.fillRect(22, y + 4, 468, INV_ROW - 8); }
    x.fillStyle = id === sel ? '#ffe3a3' : '#f3e3c3'; x.font = '31px Georgia, serif';
    x.fillText(ITEMS[id].name, 34, y + 43);
  });
  itex.needsUpdate = true;
  invDom.innerHTML = '';
  if (inv.length) { const t = document.createElement('div'); t.className = 't'; t.textContent = 'Pockets'; invDom.appendChild(t); }
  inv.forEach(id => {
    const b = document.createElement('button');
    b.textContent = ITEMS[id].name; b.id = 'item-' + id;
    if (id === sel) b.className = 'sel';
    b.addEventListener('click', e => { e.stopPropagation(); audio(); clickItem(id); });
    invDom.appendChild(b);
  });
}
function give(id) { inv.push(id); chime(); refreshInv(); }
function take(id) { inv = inv.filter(i => i !== id); if (sel === id) sel = null; refreshInv(); }
function clickItem(id) {
  if (dlg) { advance(); return; }
  if (sel === id) { sel = null; refreshInv(); say(ITEMS[id].look); return; }
  sel = id; refreshInv(); blip();
  say(['Holding: ' + ITEMS[id].name + '. Aim at something and use it, or select the item again to examine it.']);
}

/* ================= hotspots ================= */
const hot = [];
function addHot(id, label, group, cx, cy, cz, radius, handler) {
  const target = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 6), new THREE.MeshBasicMaterial({ visible: false }));
  target.position.set(cx, cy, cz);
  group.add(target);
  const h = { id, label, group, target, handler, active: true };
  target.userData.hot = h;
  hot.push(h);
  return h;
}
const NOPE = [
  'That does not seem to work.', 'You try it. Nothing happens, and it is a bit embarrassing.',
  'Not quite. The world remains unimpressed.', 'You think about it. Then you think better of it.'
];
let nopeI = 0;
function bad() { nope(); say([NOPE[nopeI++ % NOPE.length]]); }
function use(h) {
  const item = sel;
  if (!h.active) return;
  h.handler(item);
}

const hBucket = addHot('bucket', 'Tin bucket', bucketSt, 0.38, 0.88, 0, 0.3, item => {
  if (item) return bad();
  hBucket.active = false; bucketG.visible = false; give('bucket');
  say(['You lift a dented tin bucket off the fence post. It is yours now.']);
});
const hShoe = addHot('horseshoe', 'Horseshoe', hayG, -0.55, 0.1, 0.7, 0.3, item => {
  if (item) return bad();
  hShoe.active = false; shoeG.visible = false; give('horseshoe');
  say(['A horseshoe, lying in the dust beside the hay. A bit crooked. Lucky, people say.']);
});
addHot('creek', 'Crooked Creek', creekSt, 0, 0.1, 0, 1.4, item => {
  if (item === 'bucket') {
    take('bucket'); give('waterBucket');
    return say(['You dip the bucket into Crooked Creek and haul it out full. The creek seems relieved to be useful.']);
  }
  if (item === 'waterBucket') return say(['It is already full. Do not be greedy; it is a small creek.']);
  if (item) return bad();
  say(['Crooked Creek. Cold, quick, and a lot smaller than the brochure suggested.']);
});
const hHattie = addHot('hattie', 'Hattie, the cook', mess, -0.5, 1.0, 1.0, 0.55, item => {
  if (item === 'waterBucket') {
    take('waterBucket'); give('biscuit'); F.hattie = 2;
    return say([
      'Hattie|Bless you, hon, that is sweet and cold. Here, still warm.',
      'You got a warm biscuit.',
      'Hattie|Pickles would sell his own mother for one of those. Not that I know he has one.'
    ]);
  }
  if (item) return say(['Hattie|I have no use for that, hon. Water, I need. Water.']);
  if (F.hattie === 2) return say(['Hattie|The next batch is not quick, so go and put that biscuit to good use.']);
  if (!F.hattie) {
    F.hattie = 1;
    return say([
      'Hattie|Well, hang my apron. You have Barnaby Quill’s chin. You must be kin.',
      'Hattie|The dough is rising, but my water barrel is bone dry. Bring me a bucket of creek water and I will feed you.'
    ]);
  }
  if (has('bucket')) return say(['Hattie|That bucket will not walk itself to the creek, hon. It is behind you, past the post.']);
  say(['Hattie|A bucket of creek water, hon. There is a bucket on a fence post somewhere behind you.']);
});
const hDora = addHot('dora', 'Dora, the blacksmith', forge, 0.2, 1.0, 0.5, 0.55, item => {
  if (item === 'horseshoe') {
    take('horseshoe'); give('key'); F.dora = 2;
    return say([
      'Dora|Crooked as a fence rail, but it will hold. That mare has been tapping her hoof at me all morning.',
      'Dora|Here is Barnaby’s key. Brass, ugly, and heavier than it looks.',
      'You got a brass key.'
    ]);
  }
  if (item) return say(['Dora|Not what I need, friend. I need iron, shaped like a U.']);
  if (F.dora === 2) return say(['Dora|Tell Barnaby he still owes me for the axle.']);
  F.dora = 1;
  say([
    'Dora|You are Quill’s kin? He left a key with me. Said not to hand it over until the wagon work was done.',
    'Dora|I am short one horseshoe for the mare. Find me one and the key is yours.'
  ]);
});
const hMule = addHot('mule', 'Pickles, the mule', mule, 0, 1.0, 0.2, 0.75, item => {
  if (item === 'biscuit') {
    take('biscuit'); F.mule = 1;
    say([
      'You hold out the biscuit. Pickles considers it, then you, then the biscuit. A deal is struck.',
      'Pickles trots off to enjoy his winnings, and the lane to the cabin is clear.'
    ]);
    const from = mule.position.clone(), to = P(0, 7.2).add(new THREE.Vector3(3.2, 0, 1.6));
    tween(1.6, t => { mule.position.lerpVectors(from, to, t); mule.rotation.y = -t * 0.9; });
    return;
  }
  if (item) return say(['Pickles sniffs it, finds it uninteresting, and returns to blocking the lane.']);
  if (F.mule) return say(['Pickles chews contentedly and ignores you, which seems to be his gift.']);
  say([
    'Pickles the mule is parked in the lane to Quill’s cabin. He regards you the way a bank regards a loan application.',
    'He is not interested in hay. Something warm and buttered, perhaps.'
  ]);
});
const hCabin = addHot('cabin', "Quill's cabin", cabin, 0, 1.0, 1.4, 1.6, item => {
  if (!F.mule) return say(['Pickles stands in the lane between you and the cabin. He looks very pleased with himself.']);
  if (item === 'key') {
    take('key'); F.open = 1;
    say(['The key turns with a clunk. The door swings out with a long, dramatic creak.']);
    tween(1, t => { doorPivot.rotation.y = -t * 1.6; });
    return;
  }
  if (item) return bad();
  if (!F.open) return say(['The cabin door is locked. A brass lock, no less. You will need the key Dora is holding.']);
  if (!F.deed) {
    F.deed = 1; give('deed');
    return say([
      'Inside: one cot, one stove, and a tin box on the table, marked "DEED. DO NOT LOSE. I MEAN IT."',
      'You got Quill’s deed.'
    ]);
  }
  say(['Nothing left in the cabin but dust and one very surprised spider.']);
});
const hFinch = addHot('finch', 'Mr. Finch, assay clerk', office, 0, 1.0, -0.1, 0.55, item => {
  if (item === 'deed') return ending();
  if (item) return say(['Finch|I do not accept that. I accept paper, with a signature.']);
  if (has('deed')) return say(['Finch|Well? Do not wave it about. Hand it over.']);
  say([
    'Finch|Claims close at sundown. No deed, no claim. I wrote the rules, and I enjoy them.',
    'Finch|Come back with paper.'
  ]);
});

/* ================= tween / ending / reset ================= */
const tweens = [];
function tween(dur, fn) { tweens.push({ t: 0, dur, fn }); }
function setDusk(on) {
  const sky = on ? DUSK_SKY : DAY_SKY, fog = on ? DUSK_FOG : DAY_FOG;
  scene.background.copy(sky); scene.fog.color.copy(fog);
  sun.color.set(on ? 0xffb070 : 0xfff0d0); sun.position.set(on ? -9 : 6, on ? 3 : 10, on ? 6 : 4);
}
function ending() {
  take('deed');
  say([
    'Finch|Let me see that. Hm. Signed. Sealed. Remarkably correct.',
    'Finch lifts his stamp and brings it down with a thump that rattles the whole office.',
    'Finch|Claim recorded. Number one. Your uncle will be pleased, wherever he is.'
  ], () => {
    stampSfx(); setDusk(true); barnaby.visible = true;
    setTimeout(fanfare, 250);
    say([
      'The sun slides behind the hills and the sky goes the color of a ripe peach.',
      'Barnaby|There you are! Sorry I am late. I took a wrong turn at the second mountain. And the third.',
      'Barnaby|Come on. The first round of biscuits is on me.',
      "THE END|You filed Quill's Claim in the nick of time. Pull the trigger to play again."
    ], () => { resetGame(); intro(); });
  });
}
function resetGame() {
  F = {}; inv = ['letter']; sel = null;
  bucketG.visible = true; hBucket.active = true;
  shoeG.visible = true; hShoe.active = true;
  mule.position.copy(muleStart); mule.rotation.y = 0;
  doorPivot.rotation.y = 0;
  barnaby.visible = false; setDusk(false);
  refreshInv();
}
function intro() {
  const vr = renderer.xr.isPresenting;
  say([
    "QUILL'S CLAIM|Copper Ford, 1849. Four tents, one forge, and a creek that is mostly rumor.",
    'You came on the strength of a letter from your Uncle Barnaby Quill. He has staked a claim. He has also, in true Quill fashion, vanished.',
    'The assay office stamps claims until sundown. Find his deed and get it filed before Mr. Finch locks up.',
    vr ? 'Point at people and things and pull the trigger. Your pockets are on your left wrist: aim at an item to hold it, then aim at something to use it. Thumbstick turns you.'
       : 'Drag to look around. Click people and things to act. Pick an item from your pockets in the corner, then click something to use it.'
  ]);
}

/* ================= input ================= */
const rc = new THREE.Raycaster(); rc.far = 14;
const tm = new THREE.Matrix4();
function rayFromCtrl(c) {
  tm.identity().extractRotation(c.matrixWorld);
  rc.ray.origin.setFromMatrixPosition(c.matrixWorld);
  rc.ray.direction.set(0, 0, -1).applyMatrix4(tm);
}
function pick() {
  const res = { dist: 14 };
  if (renderer.xr.isPresenting && invPanel.visible && !dlg) {
    const hi = rc.intersectObject(invPanel, false)[0];
    if (hi && hi.distance < 2) {
      const row = Math.floor(((1 - hi.uv.y) * 512 - INV_HEAD) / INV_ROW);
      res.dist = hi.distance;
      if (row >= 0 && row < inv.length) res.item = inv[row];
      return res;
    }
  }
  if (dlg) return res;
  const hits = rc.intersectObjects(hot.filter(h => h.active).map(h => h.target), false);
  if (hits.length) { res.hot = hits[0].object.userData.hot; res.dist = hits[0].distance; res.point = hits[0].point; }
  return res;
}
function activate() {
  audio();
  if (dlg) { advance(); return; }
  const p = pick();
  if (p.item) return clickItem(p.item);
  if (p.hot) return use(p.hot);
  if (sel) { sel = null; refreshInv(); }
}

const ctrls = [];
for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i), grip = renderer.xr.getControllerGrip(i);
  rig.add(ctrl, grip);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]), new THREE.LineBasicMaterial({ color: 0xffd98a }));
  line.scale.z = 3; ctrl.add(line);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffd98a, depthTest: false }));
  dot.renderOrder = 11; dot.visible = false; scene.add(dot);
  const c = { ctrl, grip, line, dot, src: null, latch: false, hasPanel: false, hover: null };
  ctrls.push(c);
  ctrl.addEventListener('connected', e => {
    c.src = e.data;
    if (e.data.handedness === 'left' && !c.hasPanel) {
      grip.add(invPanel); invPanel.position.set(0, 0.09, -0.02); invPanel.rotation.set(-Math.PI / 2 + 0.5, 0, 0);
      invPanel.visible = true; c.hasPanel = true;
    }
  });
  ctrl.addEventListener('disconnected', () => {
    c.src = null;
    if (c.hasPanel) { grip.remove(invPanel); invPanel.visible = false; c.hasPanel = false; }
  });
  ctrl.addEventListener('selectstart', () => { ctrl.updateWorldMatrix(true, false); rayFromCtrl(ctrl); activate(); });
}

renderer.xr.addEventListener('sessionstart', () => {
  info.style.display = 'none'; invDom.style.display = 'none';
  setTimeout(() => { if (dlg) { placePanel(); } }, 400);
});
renderer.xr.addEventListener('sessionend', () => {
  info.style.display = 'block'; invDom.style.display = 'flex'; invPanel.visible = false;
});

/* ---- desktop mouse ---- */
let yaw = 0, pitch = 0, drag = null, mouseHot = null;
const el = renderer.domElement, ndc = new THREE.Vector2();
function mouseRay(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  rc.setFromCamera(ndc, camera);
}
el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; el.setPointerCapture?.(e.pointerId); });
el.addEventListener('pointermove', e => {
  if (renderer.xr.isPresenting) return;
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    yaw -= dx * 0.004; pitch = Math.max(-1.1, Math.min(1.1, pitch - dy * 0.004));
    rig.rotation.y = yaw; camera.rotation.x = pitch;
  }
  mouseRay(e); const p = pick(); mouseHot = p.hot || null; mouseLabelXY = [e.clientX, e.clientY];
});
el.addEventListener('pointerup', e => {
  const wasDrag = drag && drag.moved > 6; drag = null;
  if (wasDrag || renderer.xr.isPresenting) return;
  mouseRay(e); activate();
});
let mouseLabelXY = [0, 0];

/* ---- hover label (VR + desktop) ---- */
const lc = document.createElement('canvas'); lc.width = 512; lc.height = 96;
const lctx = lc.getContext('2d');
const ltex = new THREE.CanvasTexture(lc); ltex.colorSpace = THREE.SRGBColorSpace;
const label = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6 * 96 / 512), new THREE.MeshBasicMaterial({ map: ltex, transparent: true, depthTest: false }));
label.renderOrder = 12; label.visible = false; scene.add(label);
let labelText = '';
function setLabel(text) {
  if (text === labelText) return;
  labelText = text;
  const x = lctx; x.clearRect(0, 0, 512, 96);
  x.fillStyle = 'rgba(42,26,16,0.92)'; x.beginPath(); x.roundRect(4, 4, 504, 88, 20); x.fill();
  x.strokeStyle = '#d9a441'; x.lineWidth = 4; x.beginPath(); x.roundRect(8, 8, 496, 80, 16); x.stroke();
  x.fillStyle = '#f7ead0'; x.font = '34px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 256, 50);
  ltex.needsUpdate = true;
}
function hlSet(h, on) {
  h.group.traverse(o => { if (o.isMesh && o.material && o.material.emissive && !o.userData.noHL) o.material.emissive.setHex(on ? 0x4a3410 : 0x000000); });
}
let hlCur = null;
function setHover(h) {
  if (h === hlCur) return;
  if (hlCur) hlSet(hlCur, false);
  hlCur = h;
  if (h) hlSet(h, true);
}
const hoverText = h => sel ? 'Use ' + ITEMS[sel].name + ' on ' + h.label : h.label;

/* ================= main loop ================= */
const _v = new THREE.Vector3(), clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i]; w.t += dt;
    const k = Math.min(1, w.t / w.dur); w.fn(k * k * (3 - 2 * k));
    if (k >= 1) tweens.splice(i, 1);
  }
  let hovered = null, labelPos = null;
  if (renderer.xr.isPresenting) {
    scene.updateMatrixWorld();
    for (const c of ctrls) {
      const live = !!c.src;
      c.line.visible = live;
      if (!live) { c.dot.visible = false; continue; }
      rayFromCtrl(c.ctrl);
      const p = pick();
      c.line.scale.z = Math.min(p.dist, 6);
      if (p.hot || p.item) {
        _v.copy(rc.ray.direction).multiplyScalar(p.dist).add(rc.ray.origin);
        c.dot.position.copy(_v); c.dot.visible = true;
        if (p.hot && !hovered) { hovered = p.hot; labelPos = (p.point || _v).clone(); }
      } else c.dot.visible = false;
      // snap turn on the thumbstick
      const ax = c.src.gamepad && c.src.gamepad.axes ? (c.src.gamepad.axes[2] || 0) : 0;
      if (Math.abs(ax) > 0.7 && !c.latch) { c.latch = true; rig.rotation.y -= Math.sign(ax) * Math.PI / 6; }
      else if (Math.abs(ax) < 0.3) c.latch = false;
    }
  } else if (mouseHot && mouseHot.active && !dlg && !drag) {
    hovered = mouseHot;
  }
  if (dlg) hovered = null;
  setHover(hovered);
  if (hovered) {
    setLabel(hoverText(hovered));
    if (renderer.xr.isPresenting && labelPos) {
      label.position.copy(labelPos); label.position.y += 0.35;
      camera.getWorldPosition(_v); label.lookAt(_v.x, label.position.y, _v.z);
      label.visible = true;
    } else if (!renderer.xr.isPresenting) {
      const hp = new THREE.Vector3(); hovered.target.getWorldPosition(hp); hp.y += 0.9;
      camera.getWorldPosition(_v);
      label.position.copy(hp); label.lookAt(_v.x, hp.y, _v.z); label.scale.setScalar(Math.max(1, hp.distanceTo(_v) / 4));
      label.visible = true;
    }
  } else label.visible = false;
  // NPCs glance toward the player slowly: gentle idle bob
  const t = clock.elapsedTime;
  dora.position.y = Math.sin(t * 1.6) * 0.012; hattie.position.y = Math.sin(t * 1.3 + 1) * 0.012; finch.position.y = Math.sin(t * 1.1 + 2) * 0.01;
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

/* ================= start ================= */
refreshInv();
intro();
window.__quill = { hot, say: () => dlg, state: () => ({ F, inv: inv.slice(), sel }), select: id => { sel = id; }, use, advance, activate, hasDlg: () => !!dlg };
</script>

</body>
</html>
